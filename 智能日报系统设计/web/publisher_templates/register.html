<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>信息发布系统 · 创建账号</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=2) }}">
</head>
<body>
  <main class="page-shell auth-shell">
    <nav class="app-nav" aria-label="主导航"><a class="app-brand" href="http://127.0.0.1:5000/archive"><span class="brand-mark">W</span><span>工作日志</span></a><a class="nav-secondary" href="http://127.0.0.1:5000/archive">团队归档</a></nav>
    <header class="page-header">
      <p class="eyebrow">JOIN YOUR TEAM</p>
      <h1>创建成员账号</h1>
      <p class="intro">创建账号后，就可以发布工作进展并查看团队归档。</p>
    </header>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<p class="flash is-{{ category }}">{{ message }}</p>{% endfor %}
    {% endwith %}
    <form class="publisher-card publisher-form" method="post" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>用户名<input name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" autocomplete="username" required autofocus></label>
      <small>3–32 位字母、数字或 . _ -；不区分大小写。</small>
      <label>显示名称<input name="display_name" maxlength="80" autocomplete="name" required></label>
      <label>密码<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <small>密码至少 12 位，数据库只保存加盐哈希。</small>
      <label>确认密码<input type="password" name="password_confirm" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <button type="submit">创建账号</button>
    </form>
    <p class="publisher-footnote">已有账号？<a href="{{ url_for('login') }}">返回登录</a></p>
  </main>
</body>
</html>
